name: Publish CLI Release

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: Release branch to publish from (e.g. release/1.2.3 or release/1.2.3-rc.1)
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.release-branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate CLI release inputs
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      is_prerelease: ${{ steps.release-inputs.outputs.is_prerelease }}
      release_sha: ${{ steps.release-source.outputs.release_sha }}
      release_tag: v${{ steps.release-inputs.outputs.release_version }}
      release_version: ${{ steps.release-inputs.outputs.release_version }}
    steps:
      - name: Validate CLI release inputs
        id: release-inputs
        shell: bash
        run: |
          set -euo pipefail

          branch='${{ inputs.release-branch }}'

          if [[ "$branch" =~ ^release/(([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z._\-]+))?)$ ]]; then
            echo "release_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::release_branch must be formatted as release/<version>, for example release/1.2.3 or release/1.2.3-rc.1"
            exit 1
          fi

      - name: Resolve CLI release source
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ inputs.release-branch }}'
          sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/${branch}" --jq '.object.sha')
          echo "release_sha=${sha}" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: validate
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ needs.validate.outputs.release_sha }}
      release-version: ${{ needs.validate.outputs.release_version }}

  publish-release:
    name: Publish CLI release
    needs: [validate, build-cli]
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Prepare CLI release assets
        uses: ./.github/actions/prepare-release-assets

      - name: Create or validate CLI release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          tag_name='${{ needs.validate.outputs.release_tag }}'
          release_sha='${{ needs.validate.outputs.release_sha }}'

          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            existing_sha=$(git rev-list -n 1 "$tag_name")
            if [[ "$existing_sha" != "$release_sha" ]]; then
              echo "::error::Tag $tag_name already exists but points to $existing_sha instead of $release_sha"
              exit 1
            fi

            echo "Tag $tag_name already exists and points to the release commit."
          else
            git tag "$tag_name" "$release_sha"
            git push origin "$tag_name"
          fi

      - name: Create or update CLI GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          tag_name='${{ needs.validate.outputs.release_tag }}'
          prerelease=$([[ '${{ needs.validate.outputs.is_prerelease }}' == 'true' ]] && echo true || echo false)

          if gh release view "$tag_name" >/dev/null 2>&1; then
            release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${tag_name}" --jq '.id')
            gh api --method PATCH "repos/${{ github.repository }}/releases/${release_id}" \
              --field name="$tag_name" \
              --field prerelease="$prerelease"
            gh release upload "$tag_name" release-assets/* --clobber
          else
            create_args=(--verify-tag --generate-notes --title "$tag_name")
            [[ "$prerelease" == 'true' ]] && create_args+=(--prerelease)
            gh release create "$tag_name" release-assets/* "${create_args[@]}"
          fi
